# source: https://github.com/actions/starter-workflows/blob/61d42c9d0c8d4a398799a581eb6ce48ca742a2bc/ci/docker-publish.yml
name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [main]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [run_build]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    # main: Dockerfile (current ps2dev), published as :main (and :<git tag>), amd64 + arm64
    # v1.0: Dockerfile.v1.0 (legacy ps2dev v1.0), published as :v1.0 from the default branch,
    #       amd64 only (the v1.0 toolchain exists only for x86)
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: main
            dockerfile: Dockerfile
            tags: ''  # metadata-action defaults: branch, git tag, pr
            platforms: linux/amd64,linux/arm64
          - variant: v1.0
            dockerfile: Dockerfile.v1.0
            tags: type=raw,value=v1.0,enable={{is_default_branch}}
            platforms: linux/amd64
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # # Install the cosign tool except on PR
      # # https://github.com/sigstore/cosign-installer
      # - name: Install cosign
      #   if: github.event_name != 'pull_request'
      #   uses: sigstore/cosign-installer@v4.1.3
      #   with:
      #     cosign-release: 'v2.2.4'

      # QEMU runs the arm64 build on the amd64 runner
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ matrix.tags }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # one multi-arch tag: amd64 hosts (CI runners, x86 PCs) get the same amd64 image
          # as before, arm64 hosts (Apple Silicon, ARM Linux) a native one
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      # # Sign the resulting Docker image digest except on PRs.
      # # This will only write to the public Rekor transparency log when the Docker
      # # repository is public to avoid leaking data.  If you would like to publish
      # # transparency data even for private images, pass --force to cosign below.
      # # https://github.com/sigstore/cosign
      # - name: Sign the published Docker image
      #   if: ${{ github.event_name != 'pull_request' }}
      #   env:
      #     # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
      #     TAGS: ${{ steps.meta.outputs.tags }}
      #     DIGEST: ${{ steps.build-and-push.outputs.digest }}
      #   # This step uses the identity token to provision an ephemeral certificate
      #   # against the sigstore community Fulcio instance.
      #   run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
  dispatch:
    needs: build
    # downstream rebuilds only make sense when a new image was published
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        repo: ["wlaunchELF", "Open-PS2-Loader", "isjpcm", "Fceumm-PS2"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Send Compile action
        run: |
          export DISPATCH_ACTION="$(echo run_build)"
          echo "NEW_DISPATCH_ACTION=$DISPATCH_ACTION" >> $GITHUB_ENV

      - name: Dispatch to organization repositories
        uses: peter-evans/repository-dispatch@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ secrets.DISPATCH_TOKEN }}
          event-type: ${{ env.NEW_DISPATCH_ACTION }}
          client-payload: '{"ref": "${{ github.ref }}"}'
